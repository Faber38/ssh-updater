name: Build and Release SSH Updater

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ---------- Linux-Build ----------
  build-linux:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: release-python.txt

      - name: Validate build mode and application version
        id: validate
        run: python scripts/release.py workflow

      - name: Install Linux system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip check
          python scripts/release.py environment

      - name: Test release environment
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -B scripts/test_release.py

      - name: Build with PyInstaller (Linux)
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "📦 Building SSH Updater (Linux)..."
          python -m PyInstaller ssh-updater.spec --noconfirm --clean
          ls -R .

      - name: Smoke test Linux executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/ssh-updater --smoke-test

      - name: Create Linux archive
        env:
          ARTIFACT_LABEL: ${{ steps.validate.outputs.artifact_label }}
        run: |
          cd dist
          cp ../LICENSE LICENSE
          tar czf "ssh-updater-${ARTIFACT_LABEL}-linux-x86_64.tar.gz" ssh-updater LICENSE
          ls -l

      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ssh-updater-linux
          path: dist/ssh-updater-${{ steps.validate.outputs.artifact_label }}-linux-x86_64.tar.gz

  # ---------- Windows-Build ----------
  build-windows:
    runs-on: windows-2022
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: release-python.txt

      - name: Validate build mode and application version
        id: validate
        run: python scripts/release.py workflow

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip check
          python scripts/release.py environment

      - name: Test release environment
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -B scripts/test_release.py

      - name: Build Windows EXE
        run: |
          echo "📦 Building SSH Updater (Windows)..."
          python -m PyInstaller ssh-updater.spec --noconfirm --clean
          dir

      - name: Smoke test Windows executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & ./dist/ssh-updater.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create Windows ZIP
        env:
          ARTIFACT_LABEL: ${{ steps.validate.outputs.artifact_label }}
        run: |
          cd dist
          Copy-Item -LiteralPath ../LICENSE -Destination LICENSE -ErrorAction Stop
          echo "📦 Creating Windows ZIP..."
          dir
          Compress-Archive -LiteralPath "ssh-updater.exe", "LICENSE" -DestinationPath "ssh-updater-${env:ARTIFACT_LABEL}-windows-x86_64.zip"
          dir

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ssh-updater-windows
          path: dist/ssh-updater-${{ steps.validate.outputs.artifact_label }}-windows-x86_64.zip

  # ---------- Release erstellen & Assets anhängen ----------
  release:
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.build-linux.outputs.release_tag != '' &&
      needs.build-linux.outputs.release_tag == needs.build-windows.outputs.release_tag
    permissions:
      contents: write
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist

      - name: List downloaded files
        run: |
          echo "📁 Downloaded artifacts:"
          ls -R dist

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          tag_name: ${{ needs.build-linux.outputs.release_tag }}
          name: SSH Updater ${{ needs.build-linux.outputs.release_tag }}
          prerelease: ${{ contains(needs.build-linux.outputs.release_tag, '-beta') }}
          files: |
            dist/ssh-updater-linux/ssh-updater-${{ needs.build-linux.outputs.release_tag }}-linux-x86_64.tar.gz
            dist/ssh-updater-windows/ssh-updater-${{ needs.build-linux.outputs.release_tag }}-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
